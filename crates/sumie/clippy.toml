# ライブラリ（crates/sumie）の厳しい規則。手で書き換えない：
#   cargo run -p sumie-tools -- gen-disallowed        （作り直す）
#   cargo run -p sumie-tools -- gen-disallowed --check（照らす。scripts/verify.sh・CI）
# 元：rustc 1.99.0 (b940084d7 2026-09-28) の rust-src（core・alloc・std/src/num）。分類は crates/sumie-tools/src/gen_disallowed.rs
# 道具には別のゆるい設定（crates/sumie-tools/clippy.toml）。ADR-41 (6)
#
# 生成したものから外した口（使ってよいと確かめたもの）：
#   core::iter::traits::iterator::Iterator::enumerate：番号が usize を超えるのは usize::MAX を超える数の要素を数えるときだけ（文書の Panics）。ライブラリの反復は確保した配列か、上限を確かめた範囲
#   core::iter::traits::iterator::Iterator::count：同上
#   core::iter::traits::iterator::Iterator::position：同上
#   core::sync::atomic::Atomic::load：中止の印を Relaxed で読むだけ（Release・AcqRel を渡したときだけ panic する。cancel.rs の 1 か所）

# 試験の関数（#[test]・#[cfg(test)]）では unwrap・expect・panic・添字を許す。結合テストは頭で allow する
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true

# 小さいスタック（128 KiB。NFR-03）で回すため、スタックに大きなものを置かない
array-size-threshold = 4096
stack-size-threshold = 16384

