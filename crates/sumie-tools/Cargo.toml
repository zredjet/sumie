[package]
name = "sumie-tools"
description = "sumie の照合・計測・生成の道具（本番に入らない）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sumie-tools"
path = "src/main.rs"

[dependencies]
sumie = { path = "../sumie" }
sumie-testkit = { path = "../sumie-testkit" }
# 照合の相手（Kura と同じ版・同じ feature：text だけ。ADR-03）
resvg = { version = "=0.48.1", default-features = false, features = ["text"] }
# PNG の読み書き（Chrome の出力と、確かめる人のための絵）
png = "=0.17.16"
# 照合の集まりのダイジェスト
blake3 = "=1.8.7"
# bench の確保の山（スレッドごとに数える。testkit の count-alloc と同じ確保器。ADR-46）
allocation-counter = "=0.8.1"

# workspace の lints は受け継がない（ゆるい道具。ADR-43 (11)）。clippy.toml も別のゆるいもの
[lints.rust]
unsafe_code = "forbid"
