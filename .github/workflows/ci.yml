# CI（ADR-22・ADR-44 (7)）。push ごとに 3 つのターゲットで試験を回す（D1・D2 をターゲットをまたいで照らす）。
# 手元の全チェックは scripts/verify.sh（同じスクリプトを呼ぶ。手元だけの段は verify.sh の頭を見る）。
name: ci

# push だけで回す（PR を開いても同じ試験を 2 度回さない。ADR-22・ADR-35。公開のリポジトリにしたので時間の上限はない。ADR-54）
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # main の回は取り消さない（どの push の確かめも残す）
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # x86_64 Linux・aarch64 Linux・aarch64 macOS
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: ツールチェーン（rust-toolchain.toml の 1.99.0）
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: clippy（引けない口も拾う）
        run: scripts/clippy.sh
      - name: 試験（debug）
        run: cargo test --locked --workspace
      - name: 試験（release）
        run: cargo test --locked -p sumie --release
      - name: 試験（release・target-cpu=native。値がビルドの設定に依らない）
        # native の成果物をキャッシュに入れない（CPU の違う走らせ手で使い回されないように）
        env:
          RUSTFLAGS: -C target-cpu=native
          CARGO_TARGET_DIR: ${{ runner.temp }}/native
        run: cargo test --locked -p sumie --release
      - name: 本番の依存
        run: scripts/check-deps.sh

  checks:
    name: checks (ubuntu)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: ツールチェーン
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: 整形
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path scripts/lint-probe/Cargo.toml -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: 禁じる口の一覧（std の文書から作り直したものと同じか）
        run: cargo run --locked -q -p sumie-tools -- gen-disallowed --check
      - name: 禁じる口の試し
        run: cargo run --locked -q -p sumie-tools -- check-lint-probe
      - name: ゴールデンは追記だけ（履歴の全体）
        run: |
          scripts/check-goldens-append-only.sh --self-test
          scripts/check-goldens-append-only.sh --history
      - name: ゴールデンは追記だけ（main の版のスクリプトでも。同じ変更で見張りを弱められないように）
        run: |
          git fetch -q origin main
          base="$(git merge-base HEAD origin/main)"
          script=scripts/check-goldens-append-only.sh
          if git cat-file -e "$base:$script" 2>/dev/null; then
            if ! git diff --quiet "$base" HEAD -- "$script"; then
              echo "::warning::追記の見張りのスクリプトが main から変わっている（レビューで見る）"
            fi
            git show "$base:$script" > scripts/.check-goldens-base.sh
            bash scripts/.check-goldens-base.sh "$base"
          else
            echo "main にはまだ見張りのスクリプトがない"
          fi

  fuzz:
    name: fuzz (nightly)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 固定した nightly（fuzz/rust-toolchain.toml）と cargo-fuzz
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' fuzz/rust-toolchain.toml)" --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2
      - name: 組み立てと種の流し直し
        run: scripts/fuzz-seeds.sh
